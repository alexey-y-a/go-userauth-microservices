version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: userauth-postgres
    environment:
      POSTGRES_USER: userauth
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userauth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userauth -d userauth"]
      interval: 5s
      timeout: 3s
      retries: 5
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_HTTP_ADDR: ":8080"
      AUTH_POSTGRES_DSN: "postgres://userauth:password@postgres:5432/userauth?sslmode=disable"
      JWT_SECRET: "super-secret-key-change-me"
    ports:
      - "8080:8080"
    networks:
      - app-net

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_HTTP_ADDR: ":8081"
      USER_POSTGRES_DSN: "postgres://userauth:password@postgres:5432/userauth?sslmode=disable"
    ports:
      - "8081:8081"
    networks:
      - app-net

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway-service
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      GATEWAY_HTTP_ADDR: ":8082"
      AUTH_SERVICE_URL: "http://auth-service:8080"
      USER_SERVICE_URL: "http://user-service:8081"
    ports:
      - "8082:8082"
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - app-net
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      gateway-service:
        condition: service_started

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    networks:
      - app-net
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  prometheus-data:
  grafana-data:

networks:
  app-net:
    driver: bridge