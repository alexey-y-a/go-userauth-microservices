global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway-service:8082"]