apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-userauth-microservices.fullname" . }}-suer
  labels:
    {{- include "go-userauth-microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "go-userauth-microservices.fullname" . }}-suer
    app.kubernetes.io/component: user-service
  ports:
    - name: http
      port: {{ .Values.userService.service.port }}
      targetPort: http