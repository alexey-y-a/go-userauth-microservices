apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-userauth-microservices.fullname" . }}-auth
  labels:
    {{- include "go-userauth-microservices.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "go-userauth-microservices.fullname" . }}-auth
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "go-userauth-microservices.fullname" . }}-auth
        app.kubernetes.io/component: auth-service
        {{- include "go-userauth-microservices.labels" . | nindent 8 }}
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag }}"
          imagePullPolicy: {{ .Values.authService.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.authService.service.port }}
          env:
            - name: HTTP_PORT
              value: "{{ .Values.authService.service.port }}"
            - name: POSTGRES_DSN
              value: "{{ .Values.postgres.dsn }}"
            - name: JWT_SECRET
              value: "{{ .Values.jwt.secret }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
